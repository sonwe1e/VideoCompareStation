name: Prepare hosted Windows
description: Provision the pinned toolchain and vcpkg binary cache on a GitHub-hosted VM
inputs:
  cache-scope:
    description: Separate immutable archive snapshots for full and model-only build roles
    default: software
runs:
  using: composite
  steps:
    - name: Require GitHub-hosted Windows
      shell: pwsh
      run: |
        if ($env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows') {
          throw 'Software CI must run on GitHub-hosted Windows, never the personal workstation.'
        }
        "runner=$env:RUNNER_NAME image=$env:ImageOS version=$env:ImageVersion" |
          Out-File $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
      with:
        python-version: '3.12'

    - name: Cache pinned LLVM
      id: llvm-cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/dvs-ci/llvm
        key: windows-2022-llvm-19.1.5-v1

    - name: Provision and verify pinned tools
      id: tools
      shell: pwsh
      run: .\tools\ci\setup-hosted-windows.ps1

    - name: Save verified LLVM before the dependency build
      if: steps.llvm-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/dvs-ci/llvm
        key: windows-2022-llvm-19.1.5-v1

    - name: Check out pinned vcpkg registry
      uses: actions/checkout@v6
      with:
        repository: microsoft/vcpkg
        ref: 7d1c862c25e1bde631d866d82fdc86213983271c
        fetch-depth: 0
        path: out/ci/vcpkg
        persist-credentials: false

    - name: Restore vcpkg binary archives
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/dvs-ci/vcpkg-archives
        key: windows-2022-vcpkg-${{ steps.tools.outputs.msvc }}-${{ steps.tools.outputs.sdk }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/actions/setup-windows/action.yml', 'tools/ci/setup-hosted-windows.ps1') }}-${{ inputs.cache-scope }}-v1
        restore-keys: |
          windows-2022-vcpkg-${{ steps.tools.outputs.msvc }}-

    - name: Bootstrap isolated vcpkg
      shell: pwsh
      run: |
        $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE 'out/ci/vcpkg'
        $expected = '7d1c862c25e1bde631d866d82fdc86213983271c'
        $actual = (git -C $vcpkgRoot rev-parse HEAD).Trim()
        if ($LASTEXITCODE -ne 0 -or $actual -cne $expected) { throw 'vcpkg tool checkout mismatch.' }
        $overrides = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).overrides
        $checked = 0
        foreach ($override in $overrides) {
          $name = $override.name
          $database = Join-Path $vcpkgRoot "versions/$($name.Substring(0, 1))-/$name.json"
          $entries = (Get-Content -LiteralPath $database -Raw | ConvertFrom-Json).versions
          $revision = if ($override.PSObject.Properties['port-version']) { $override.'port-version' } else { 0 }
          $match = @($entries | Where-Object { $_.version -eq $override.version -and $_.'port-version' -eq $revision })
          if ($match.Count -ne 1) { throw "Pinned dependency not found: $name $($override.version)#$revision" }
          $checked++
        }
        if ($checked -ne 4) { throw "Expected four pinned dependency checks, ran $checked." }
        & (Join-Path $vcpkgRoot 'bootstrap-vcpkg.bat') -disableMetrics
        if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed.' }
        $archives = Join-Path $env:RUNNER_TEMP 'dvs-ci/vcpkg-archives'
        New-Item -ItemType Directory -Path $archives -Force | Out-Null
        "VCPKG_ROOT=$vcpkgRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "DVS_VCPKG_ROOT=$vcpkgRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
        "VCPKG_BINARY_SOURCES=clear;files,$archives,readwrite" |
          Out-File $env:GITHUB_ENV -Encoding utf8 -Append
