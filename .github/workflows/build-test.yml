name: Build and Test

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      # Documentation-only pushes do not touch code, scripts, or workflow definitions;
      # Avoid rebuilding the native matrix for documentation-only pushes.
      - 'docs/**'
      - '**.md'
      - '**.txt'

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  # Finish the active cold build/cache; concurrency retains only the latest pending run.
  cancel-in-progress: false

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: windows-2022
    timeout-minutes: 240

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug tests
            preset: dev
          - name: Release tests
            preset: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false

      - name: Materialize LFS files
        shell: pwsh
        run: git lfs checkout

      - name: Enter MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Prepare hosted toolchain and dependency cache
        uses: ./.github/actions/setup-windows
        with:
          cache-scope: ${{ matrix.preset }}

      - name: Configure
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake
          --preset ${{ matrix.preset }} --fresh

      - name: Check generated full UI test source routing
        shell: pwsh
        run: python tools/quality/check-ui-test-routing.py --build-dir out/build/${{ matrix.preset }} --adapters on

      - name: Build
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake
          --build --preset ${{ matrix.preset }}

      - name: Complete software regression
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest
          --preset ${{ matrix.preset }} --output-on-failure --no-tests=error
          --output-junit "${{ github.workspace }}/out/build/${{ matrix.preset }}/Testing/ci-full.xml"

      - name: Run startup check
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1
          ".\out\build\${{ matrix.preset }}\bin\CompareStationCli.exe"
          --startup-check

      - name: Windows core-only build and tests
        if: matrix.preset == 'dev'
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --preset core-dev --fresh
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --build --preset core-dev
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest --preset core-dev

      - name: Upload software test and dependency logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.preset }}-${{ github.sha }}
          path: |
            out/build/**/Testing/**
            out/ci/vcpkg/buildtrees/**/*.log
          if-no-files-found: warn
          retention-days: 14

  ui-models:
    name: Windows UI model-only tests
    runs-on: windows-2022
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false
      - name: Materialize LFS files
        shell: pwsh
        run: git lfs checkout
      - name: Enter MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Prepare hosted toolchain and dependency cache
        uses: ./.github/actions/setup-windows
        with:
          cache-scope: models
      - name: Configure model-only preset and verify its source boundary
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --preset ui-dev --fresh
          python tools/quality/check-ui-test-routing.py --build-dir out/build/ui-dev --adapters off
          if ($LASTEXITCODE -ne 0) { throw 'Model-only test source routing failed.' }
      - name: Build and test UI models
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --build --preset ui-dev
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest --preset ui-dev --output-on-failure --no-tests=error
      - name: Upload model test and dependency logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-models-${{ github.sha }}
          path: |
            out/build/ui-dev/Testing/**
            out/ci/vcpkg/buildtrees/**/*.log
          if-no-files-found: warn
          retention-days: 14

  core-linux:
    name: Linux Clang core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false

      - name: Materialize LFS files
        shell: pwsh
        run: git lfs checkout

      - name: Provision pinned CMake and vcpkg
        shell: bash
        run: |
          python3 -m pip install --user --disable-pip-version-check cmake==4.4.0 ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Configure, build, and test core
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=4 VCPKG_MAX_CONCURRENCY=4 cmake --preset core-dev --fresh
          CMAKE_BUILD_PARALLEL_LEVEL=4 cmake --build --preset core-dev
          CTEST_PARALLEL_LEVEL=1 ctest --preset core-dev --output-on-failure
