name: Build and Test

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    # Never execute code from an untrusted fork on the workstation runner.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, dvs-toolchain-4.4]
    timeout-minutes: 120
    env:
      DVS_VCPKG_ROOT: ${{ vars.DVS_VCPKG_ROOT }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug tests
            preset: dev
          - name: Release tests
            preset: release

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enter MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Verify pinned toolchain
        shell: powershell
        run: |
          $cmakeVersion = cmake --version | Select-Object -First 1
          if ($cmakeVersion -notmatch '^cmake version 4\.4(\.|$)') {
            throw "Expected CMake 4.4.x, found: $cmakeVersion"
          }
          $vcpkgRoot = if ($env:DVS_VCPKG_ROOT) {
            $env:DVS_VCPKG_ROOT
          } elseif ($env:VCPKG_ROOT) {
            $env:VCPKG_ROOT
          } elseif ($env:VCPKG_INSTALLATION_ROOT) {
            $env:VCPKG_INSTALLATION_ROOT
          } else {
            throw 'Set the DVS_VCPKG_ROOT repository variable.'
          }
          if (-not (Test-Path -LiteralPath "$vcpkgRoot\scripts\buildsystems\vcpkg.cmake")) {
            throw "Invalid vcpkg root: $vcpkgRoot"
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $llvmBin = Join-Path $env:VCINSTALLDIR 'Tools\Llvm\x64\bin'
          if (-not (Test-Path -LiteralPath $llvmBin -PathType Container)) {
            throw "Visual Studio LLVM tools were not found: $llvmBin"
          }
          $env:PATH = "$llvmBin;$env:PATH"
          $llvmBin | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          Get-Command cl.exe, ninja.exe, clang-format.exe, clang-tidy.exe -ErrorAction Stop

      - name: Configure
        shell: powershell
        run: >-
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake
          --preset ${{ matrix.preset }} --fresh

      - name: Build
        shell: powershell
        run: >-
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake
          --build --preset ${{ matrix.preset }}

      - name: Unit tests
        shell: powershell
        run: >-
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest
          --preset ${{ matrix.preset }} -L unit --output-on-failure

      - name: Component and smoke tests
        shell: powershell
        run: >-
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest
          --preset ${{ matrix.preset }}
          -L "component|e2e" --output-on-failure

      - name: Run startup check
        shell: powershell
        run: >-
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1
          ".\out\build\${{ matrix.preset }}\bin\VCStationCli.exe"
          --startup-check

      - name: Windows core-only build and tests
        if: matrix.preset == 'dev'
        shell: powershell
        run: |
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --preset core-dev --fresh
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --build --preset core-dev
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest --preset core-dev

      - name: Windows UI model-only build and tests
        if: matrix.preset == 'dev'
        shell: powershell
        run: |
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --preset ui-dev --fresh
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --build --preset ui-dev
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest --preset ui-dev

  core-linux:
    name: Linux Clang core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang-18
      CXX: clang++-18

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Provision pinned CMake and vcpkg
        shell: bash
        run: |
          python3 -m pip install --user --disable-pip-version-check cmake==4.4.0 ninja
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Configure, build, and test core
        shell: bash
        run: |
          CMAKE_BUILD_PARALLEL_LEVEL=4 VCPKG_MAX_CONCURRENCY=4 cmake --preset core-dev --fresh
          CMAKE_BUILD_PARALLEL_LEVEL=4 cmake --build --preset core-dev
          CTEST_PARALLEL_LEVEL=1 ctest --preset core-dev --output-on-failure
