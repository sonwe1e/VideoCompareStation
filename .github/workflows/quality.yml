name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-guide:
    name: Repository guide and script contracts
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check contributor guide
        shell: powershell
        run: .\tools\quality\check-repository-guide.ps1

      - name: Check resource limit policy
        shell: powershell
        run: .\tools\quality\check-resource-limits.ps1

      - name: Check coverage gate behavior
        shell: powershell
        run: >-
          .\tools\quality\check-coverage.ps1
          -BuildDir tests\fixtures\coverage
          -ReportPath tests\fixtures\coverage\sample.cobertura.xml
          -Module All
          -Minimum 75.0

  native-quality:
    name: Native format and lint
    # Never execute code from an untrusted fork on the workstation runner.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, Windows, X64, dvs-toolchain-4.4]
    timeout-minutes: 60
    env:
      DVS_VCPKG_ROOT: ${{ vars.DVS_VCPKG_ROOT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enter MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Verify pinned toolchain
        shell: powershell
        run: |
          $cmakeVersion = cmake --version | Select-Object -First 1
          if ($cmakeVersion -notmatch '^cmake version 4\.4(\.|$)') {
            throw "Expected CMake 4.4.x, found: $cmakeVersion"
          }
          $vcpkgRoot = if ($env:DVS_VCPKG_ROOT) {
            $env:DVS_VCPKG_ROOT
          } elseif ($env:VCPKG_ROOT) {
            $env:VCPKG_ROOT
          } elseif ($env:VCPKG_INSTALLATION_ROOT) {
            $env:VCPKG_INSTALLATION_ROOT
          } else {
            throw 'Set the DVS_VCPKG_ROOT repository variable.'
          }
          if (-not (Test-Path -LiteralPath "$vcpkgRoot\scripts\buildsystems\vcpkg.cmake")) {
            throw "Invalid vcpkg root: $vcpkgRoot"
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $llvmBin = Join-Path $env:VCINSTALLDIR 'Tools\Llvm\x64\bin'
          if (-not (Test-Path -LiteralPath $llvmBin -PathType Container)) {
            throw "Visual Studio LLVM tools were not found: $llvmBin"
          }
          $env:PATH = "$llvmBin;$env:PATH"
          $llvmBin | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          Get-Command cl.exe, ninja.exe, clang-format.exe, clang-tidy.exe -ErrorAction Stop

      - name: Configure development preset
        shell: powershell
        run: >-
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake
          --preset dev --fresh

      - name: Build development preset
        shell: powershell
        run: >-
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake
          --build --preset dev

      - name: Check formatting
        shell: powershell
        run: >-
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake
          --build --preset dev --target format-check

      - name: Run static analysis
        shell: powershell
        run: >-
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake
          --build --preset dev --target lint
