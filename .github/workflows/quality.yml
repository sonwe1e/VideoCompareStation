name: Quality

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-guide:
    name: Repository guide and script contracts
    runs-on: windows-2022
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false

      - name: Materialize LFS files
        shell: pwsh
        run: git lfs checkout

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'

      - name: Check workflow routing and counterexamples
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          if ($LASTEXITCODE -ne 0) { throw 'Could not install the workflow parser.' }
          python tools/quality/check-ci-workflows.py --self-test
          if ($LASTEXITCODE -ne 0) { throw 'CI routing checks failed.' }
          .\tools\quality\check-ci-evidence.ps1

      - name: Check contributor guide
        shell: pwsh
        run: .\tools\quality\check-repository-guide.ps1

      - name: Check resource limit policy
        shell: pwsh
        run: .\tools\quality\check-resource-limits.ps1

      - name: Check build wrapper contracts
        shell: pwsh
        run: .\tools\quality\check-build-scripts.ps1

      - name: Check coverage gate behavior
        shell: pwsh
        run: >-
          .\tools\quality\check-coverage.ps1
          -BuildDir tests\fixtures\coverage
          -SourceRoot tests\fixtures\coverage\src
          -ReportPath tests\fixtures\coverage\sample.cobertura.xml
          -Module All
          -Minimum 75.0

  native-quality:
    name: Native format and lint
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          lfs: true
          persist-credentials: false

      - name: Materialize LFS files
        shell: pwsh
        run: git lfs checkout

      - name: Enter MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Prepare hosted toolchain and dependency cache
        uses: ./.github/actions/setup-windows

      - name: Configure development preset
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake
          --preset dev --fresh -DCLANG_FORMAT_EXECUTABLE="$env:DVS_CI_LLVM_BIN/clang-format.exe" -DCLANG_TIDY_EXECUTABLE="$env:DVS_CI_LLVM_BIN/clang-tidy.exe"

      - name: Build development preset
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake
          --build --preset dev

      - name: Check formatting
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake
          --build --preset dev --target format-check

      - name: Run static analysis
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake
          --build --preset dev --target lint

      - name: Upload native quality logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-quality-${{ github.sha }}
          path: |
            out/build/dev/Testing/**
            out/ci/vcpkg/buildtrees/**/*.log
          if-no-files-found: warn
          retention-days: 14
