name: Hardware and Performance

# Kept separate from Build and Test on purpose: these suites need a GPU-equipped,
# interactively logged-in self-hosted runner and external performance fixtures. It includes
# actual Wipe/Diff pixel captures before the source-count performance profiles.
# They run on demand instead of accepting pull-request code on the workstation.

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Exact commit that must be tested
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hardware-performance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hardware-performance:
    name: Hardware and performance suites
    runs-on: [self-hosted, Windows, X64, dvs-gpu]
    timeout-minutes: 180
    env:
      DVS_VCPKG_ROOT: ${{ vars.DVS_VCPKG_ROOT }}
      DVS_PERFORMANCE_FIXTURE_ROOT: ${{ vars.DVS_PERFORMANCE_FIXTURE_ROOT }}
      DVS_EXPECTED_SHA: ${{ inputs.commit_sha || github.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ env.DVS_EXPECTED_SHA }}

      - name: Verify tested commit
        shell: powershell
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          if ($actualSha -cne $env:DVS_EXPECTED_SHA) {
            throw "Expected commit $env:DVS_EXPECTED_SHA, checked out $actualSha."
          }
          "DVS_TESTED_SHA=$actualSha" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Enter MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Verify pinned toolchain
        shell: powershell
        run: |
          $cmakeVersion = cmake --version | Select-Object -First 1
          if ($cmakeVersion -notmatch '^cmake version 4\.4(\.|$)') {
            throw "Expected CMake 4.4.x, found: $cmakeVersion"
          }
          $vcpkgRoot = if ($env:DVS_VCPKG_ROOT) {
            $env:DVS_VCPKG_ROOT
          } elseif ($env:VCPKG_ROOT) {
            $env:VCPKG_ROOT
          } elseif ($env:VCPKG_INSTALLATION_ROOT) {
            $env:VCPKG_INSTALLATION_ROOT
          } else {
            throw 'Set the DVS_VCPKG_ROOT repository variable.'
          }
          if (-not (Test-Path -LiteralPath "$vcpkgRoot\scripts\buildsystems\vcpkg.cmake")) {
            throw "Invalid vcpkg root: $vcpkgRoot"
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $llvmBin = Join-Path $env:VCINSTALLDIR 'Tools\Llvm\x64\bin'
          if (-not (Test-Path -LiteralPath $llvmBin -PathType Container)) {
            throw "Visual Studio LLVM tools were not found: $llvmBin"
          }
          $env:PATH = "$llvmBin;$env:PATH"
          $llvmBin | Out-File $env:GITHUB_PATH -Encoding utf8 -Append
          Get-Command cl.exe, ninja.exe, clang-format.exe, clang-tidy.exe -ErrorAction Stop

      - name: Verify hardware fixtures and runner desktop
        shell: powershell
        run: |
          if (-not $env:DVS_PERFORMANCE_FIXTURE_ROOT) {
            throw 'Set the repository variable DVS_PERFORMANCE_FIXTURE_ROOT.'
          }
          $required = @(
            'gate-1080p60-a.mp4',
            'gate-1080p60-b.mp4',
            'gate-1080p60-diff-b.mp4',
            'gate-1080p60-diff-b.contract.json',
            'gate-1080p60-c.mp4',
            'gate-1080p60-rot90-a.mp4',
            'gate-1080p120-a.mp4',
            'gate-1080p120-b.mp4',
            'gate-1080p120-c.mp4'
          )
          foreach ($name in $required) {
            $path = Join-Path $env:DVS_PERFORMANCE_FIXTURE_ROOT $name
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Missing performance fixture: $path"
            }
          }
          .\tools\testing\test-hardware-runner.ps1 -MinimumRefreshRate 120

      - name: Configure
        shell: powershell
        run: >-
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake
          --preset release --fresh

      - name: Build
        shell: powershell
        run: >-
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake
          --build --preset release

      - name: D3D11VA, zero-copy, and comparison pixel tests
        shell: powershell
        env:
          DVS_EXECUTION_RESOURCE_PROFILE: Interactive
        run: >-
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest
          --preset hardware-d3d11 --output-on-failure

      - name: Release-blocking performance gates
        shell: powershell
        env:
          DVS_EXECUTION_RESOURCE_PROFILE: Interactive
        run: >-
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest
          --preset performance-d3d11 --output-on-failure

      - name: Collect performance logs
        if: always()
        shell: powershell
        run: |
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE 'out\performance-results'
          New-Item -ItemType Directory -Path $artifactRoot -Force | Out-Null
          $env:DVS_TESTED_SHA |
            Set-Content (Join-Path $artifactRoot 'tested-commit.txt') -Encoding ascii
          @(
            'Release-blocking profiles:',
            '- configure/build profile: background-4-cpu (BelowNormal priority)',
            '- hardware/performance profile: interactive-normal (full runner CPU affinity, CTest serial)',
            '- hardware.wipe-2source and hardware.diff-2source (visible pixel capture)',
            '- hardware.mode-switch-retained-frame (canonical frame retained through Side to Wipe)',
            '- hardware.rotated-padded-wipe (90-degree D3D11VA texture capture)',
            '- 1080p60-1source',
            '- 1080p60-2source',
            '- 1080p60',
            '- 1080p120-1source',
            '- 1080p120-2source',
            '- 1080p120-3source'
          ) | Set-Content (Join-Path $artifactRoot 'release-gate-policy.txt') -Encoding ascii
          $resultRoot = Join-Path $env:DVS_PERFORMANCE_FIXTURE_ROOT 'results'
          if (Test-Path -LiteralPath $resultRoot) {
            $profiles = @(
              '1080p60-1source',
              '1080p60-2source',
              '1080p60-2source-wipe',
              '1080p60-2source-diff',
              '1080p60-2source-mode-switch-wipe',
              '1080p60-2source-rotated-wipe',
              '1080p60',
              '1080p120-1source',
              '1080p120-2source',
              '1080p120-3source'
            )
            foreach ($profile in $profiles) {
              foreach ($stream in @('stdout', 'stderr')) {
                $logPath = Join-Path $resultRoot "$profile-$stream.log"
                if (Test-Path -LiteralPath $logPath -PathType Leaf) {
                  Copy-Item -LiteralPath $logPath -Destination $artifactRoot -Force
                }
              }
            }
          }

      - name: Upload performance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hardware-performance-logs-${{ github.sha }}
          path: out/performance-results
          if-no-files-found: warn
          retention-days: 14
