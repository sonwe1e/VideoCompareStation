name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release identity
    runs-on: [self-hosted, Windows, X64, dvs-toolchain-4.4]
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate tag and project version
        id: version
        shell: powershell
        run: |
          .\tools\release\verify-release-version.ps1 -Tag $env:GITHUB_REF_NAME
          $version = $env:GITHUB_REF_NAME.Substring(1)
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify release commit
        shell: powershell
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          if ($actualSha -cne '${{ github.sha }}') {
            throw "Expected commit ${{ github.sha }}, checked out $actualSha."
          }
          .\tools\release\verify-release-commit.ps1

  quality:
    name: Quality suites
    needs: validate-version
    runs-on: [self-hosted, Windows, X64, dvs-toolchain-4.4]
    timeout-minutes: 180
    env:
      DVS_VCPKG_ROOT: ${{ vars.DVS_VCPKG_ROOT }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enter MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Resolve pinned toolchain
        shell: powershell
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          if ($actualSha -cne '${{ github.sha }}') {
            throw "Expected commit ${{ github.sha }}, checked out $actualSha."
          }
          $cmakeVersion = cmake --version | Select-Object -First 1
          if ($cmakeVersion -notmatch '^cmake version 4\.4(\.|$)') {
            throw "Expected CMake 4.4.x, found: $cmakeVersion"
          }
          $vcpkgRoot = if ($env:DVS_VCPKG_ROOT) {
            $env:DVS_VCPKG_ROOT
          } elseif ($env:VCPKG_ROOT) {
            $env:VCPKG_ROOT
          } elseif ($env:VCPKG_INSTALLATION_ROOT) {
            $env:VCPKG_INSTALLATION_ROOT
          } else {
            throw 'Set the DVS_VCPKG_ROOT repository variable.'
          }
          if (-not (Test-Path -LiteralPath "$vcpkgRoot\scripts\buildsystems\vcpkg.cmake")) {
            throw "Invalid vcpkg root: $vcpkgRoot"
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $llvmBin = Join-Path $env:VCINSTALLDIR 'Tools\Llvm\x64\bin'
          if (-not (Test-Path -LiteralPath $llvmBin -PathType Container)) {
            throw "Visual Studio LLVM tools were not found: $llvmBin"
          }
          $llvmBin | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Debug build, tests, and quality
        shell: powershell
        run: |
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --preset dev --fresh
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --build --preset dev
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest --preset dev --output-on-failure
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --build --preset dev --target format-check
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --build --preset dev --target lint

      - name: Release build and tests
        shell: powershell
        run: |
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --preset release --fresh
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --build --preset release
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest --preset release --output-on-failure

  hardware-performance:
    name: Hardware and performance suites
    needs: validate-version
    uses: ./.github/workflows/hardware-performance.yml
    with:
      commit_sha: ${{ github.sha }}

  release:
    name: Build and publish release
    needs:
      - validate-version
      - quality
      - hardware-performance
    runs-on: [self-hosted, Windows, X64, dvs-toolchain-4.4]
    timeout-minutes: 180
    env:
      DVS_VCPKG_ROOT: ${{ vars.DVS_VCPKG_ROOT }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Enter MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Verify unsigned 1.6.0 release scope
        shell: powershell
        run: |
          if ($env:GITHUB_REF_NAME -cne 'v1.6.0') {
            throw (
              'This workflow currently publishes only the explicitly unsigned v1.6.0 build.'
            )
          }

      - name: Resolve toolchain and previous release
        shell: powershell
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          if ($actualSha -cne '${{ github.sha }}') {
            throw "Expected commit ${{ github.sha }}, checked out $actualSha."
          }
          $vcpkgRoot = if ($env:DVS_VCPKG_ROOT) {
            $env:DVS_VCPKG_ROOT
          } elseif ($env:VCPKG_ROOT) {
            $env:VCPKG_ROOT
          } else {
            throw 'Set the DVS_VCPKG_ROOT repository variable.'
          }
          "VCPKG_ROOT=$vcpkgRoot" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          $llvmBin = Join-Path $env:VCINSTALLDIR 'Tools\Llvm\x64\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $llvmBin 'clang-format.exe'))) {
            throw "Visual Studio LLVM tools were not found: $llvmBin"
          }
          $llvmBin | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

          $wixPath = Join-Path $env:RUNNER_TEMP 'wix'
          $wix = Join-Path $wixPath 'wix.exe'
          if (-not (Test-Path -LiteralPath $wix -PathType Leaf)) {
            dotnet tool install wix --tool-path $wixPath --version 4.0.4
          }
          $extensions = & $wix extension list --global
          if ($extensions -notmatch 'WixToolset\.UI\.wixext 4\.0\.4') {
            & $wix extension add --global WixToolset.UI.wixext/4.0.4
          }
          $wixPath | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

          $previousRoot = Join-Path $env:RUNNER_TEMP "vcstation-previous-${{ github.run_id }}"
          New-Item -ItemType Directory -Path $previousRoot -Force | Out-Null
          $previousReleases = @(
            @{
              Tag = 'v1.2.0'
              File = 'VCStation-1.2.0-windows-x64.msi'
              EnvironmentVariable = 'DVS_PREVIOUS_RELEASE_1_2_MSI'
            }
          )
          foreach ($previous in $previousReleases) {
            gh release download $previous.Tag `
              --pattern $previous.File `
              --dir $previousRoot `
              --clobber
            $previousMsi = Join-Path $previousRoot $previous.File
            if (-not (Test-Path -LiteralPath $previousMsi -PathType Leaf)) {
              throw "Previous release MSI was not downloaded: $previousMsi"
            }
            "$($previous.EnvironmentVariable)=$previousMsi" |
              Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Build and test Release
        shell: powershell
        run: |
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --preset release --fresh
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --build --preset release
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest --preset release --output-on-failure
          $metadata = Get-Content '.\out\build\release\release-metadata.json' -Raw |
            ConvertFrom-Json
          "DVS_SHELL_BINARY_NAME=$($metadata.shellBinaryName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Frame provider terminal-retirement stress
        shell: powershell
        run: >-
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest
          --preset release --output-on-failure
          -R "media.MultiSourceFrameProviderTests.SequentialPlaybackDoesNotRetainHistoricalCpuPairs"
          --repeat until-fail:100

      - name: Package and validate release identity
        shell: powershell
        run: |
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cpack --preset release-zip
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cpack --preset release-msi
          $version = '${{ needs.validate-version.outputs.version }}'
          $zip = Resolve-Path ".\out\package\zip\VCStation-$version-windows-x64.zip"
          $msi = Resolve-Path ".\out\package\msi\VCStation-$version-windows-x64.msi"
          wix msi validate $msi.Path
          .\tools\release\verify-release-version.ps1 `
            -Tag $env:GITHUB_REF_NAME `
            -Executable '.\out\build\release\bin\VCStation.exe' `
            -ZipPath $zip.Path `
            -MsiPath $msi.Path
          "DVS_RELEASE_ZIP=$($zip.Path)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "DVS_RELEASE_MSI=$($msi.Path)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Packaged upgrade and shutdown gates
        shell: powershell
        run: |
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest --preset packaged-smoke --output-on-failure
          powershell -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest --preset shutdown-soak --output-on-failure

      - name: Create checksums
        shell: powershell
        run: |
          $lines = foreach ($artifact in @($env:DVS_RELEASE_ZIP, $env:DVS_RELEASE_MSI)) {
            $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($artifact))"
          }
          $lines | Set-Content '.\out\package\SHA256SUMS.txt' -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          draft: true
          body_path: docs/releases/v1.6.0.md
          files: |
            out/package/zip/VCStation-${{ needs.validate-version.outputs.version }}-windows-x64.zip
            out/package/msi/VCStation-${{ needs.validate-version.outputs.version }}-windows-x64.msi
            out/package/SHA256SUMS.txt
