name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag whose exact commit is being released
        required: true
        type: string
      hardware_run_id:
        description: Successful manual Hardware and Performance run for that exact commit
        required: true
        type: string
  push:
    tags:
      - 'v*'

env:
  DVS_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-version:
    name: Validate release identity
    runs-on: windows-2022
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.identity.outputs.commit }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          ref: ${{ inputs.tag || github.ref }}
          lfs: true
          persist-credentials: false

      - name: Validate tag and project version
        id: version
        shell: pwsh
        run: |
          .\tools\release\verify-release-version.ps1 -Tag $env:DVS_RELEASE_TAG
          $version = $env:DVS_RELEASE_TAG.Substring(1)
          "version=$version" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify release commit
        id: identity
        shell: pwsh
        run: |
          $actualSha = (git rev-parse HEAD).Trim()
          .\tools\release\verify-release-commit.ps1
          "commit=$actualSha" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append

  quality:
    name: Quality suites
    needs: validate-version
    runs-on: windows-2022
    timeout-minutes: 240

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-version.outputs.commit }}
          lfs: true
          persist-credentials: false

      - name: Materialize LFS files
        shell: pwsh
        run: git lfs checkout

      - name: Enter MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Prepare hosted toolchain and dependency cache
        uses: ./.github/actions/setup-windows

      - name: Debug build, tests, and quality
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --preset dev --fresh -DCLANG_FORMAT_EXECUTABLE="$env:DVS_CI_LLVM_BIN/clang-format.exe" -DCLANG_TIDY_EXECUTABLE="$env:DVS_CI_LLVM_BIN/clang-tidy.exe"
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --build --preset dev
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest --preset dev --output-on-failure
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --build --preset dev --target format-check
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --build --preset dev --target lint

      - name: Release build and tests
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --preset release --fresh -DCLANG_FORMAT_EXECUTABLE="$env:DVS_CI_LLVM_BIN/clang-format.exe" -DCLANG_TIDY_EXECUTABLE="$env:DVS_CI_LLVM_BIN/clang-tidy.exe"
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --build --preset release
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest --preset release --output-on-failure

  hardware-performance:
    name: Verify prior manual hardware evidence
    if: github.event_name == 'workflow_dispatch'
    needs: validate-version
    runs-on: windows-2022
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      DVS_HARDWARE_RUN_ID: ${{ inputs.hardware_run_id }}
      DVS_EXPECTED_SHA: ${{ needs.validate-version.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-version.outputs.commit }}
          persist-credentials: false
      - name: Require successful hardware run for the release commit
        shell: pwsh
        run: |
          if ($env:DVS_HARDWARE_RUN_ID -notmatch '^[0-9]+$') { throw 'Expected a numeric hardware run ID.' }
          $response = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:DVS_HARDWARE_RUN_ID"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read hardware evidence.' }
          $run = $response | ConvertFrom-Json
          .\tools\ci\test-hardware-evidence.ps1 -Run $run -ExpectedSha $env:DVS_EXPECTED_SHA

  release:
    if: github.event_name == 'workflow_dispatch'
    name: Build and publish release
    needs:
      - validate-version
      - quality
      - hardware-performance
    runs-on: windows-2022
    timeout-minutes: 240
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.validate-version.outputs.commit }}
          lfs: true
          persist-credentials: false

      - name: Materialize LFS files
        shell: pwsh
        run: git lfs checkout

      - name: Enter MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Verify unsigned release scope
        shell: pwsh
        run: |
          # This workflow produces an explicitly unsigned build: no signing certificate is
          # configured for this runner, and the release metadata has to keep "signed" false.
          # The guard names the one tag it is allowed to publish so that a tag cannot silently
          # turn into a release nobody verified. Widen it deliberately, one version at a time.
          $allowed = @('v2.0.3', 'v2.1.0', 'v2.2.0', 'v2.3.0', 'v2.4.0', 'v2.5.0')
          if ($env:DVS_RELEASE_TAG -cnotin $allowed) {
            throw (
              "This workflow publishes only the explicitly unsigned build(s): " +
              ($allowed -join ', ')
            )
          }

      - name: Prepare hosted toolchain and dependency cache
        uses: ./.github/actions/setup-windows

      - name: Build and test Release
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --preset release --fresh -DCLANG_FORMAT_EXECUTABLE="$env:DVS_CI_LLVM_BIN/clang-format.exe" -DCLANG_TIDY_EXECUTABLE="$env:DVS_CI_LLVM_BIN/clang-tidy.exe"
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cmake --build --preset release
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest --preset release --output-on-failure
          $metadata = Get-Content '.\out\build\release\release-metadata.json' -Raw |
            ConvertFrom-Json
          "DVS_SHELL_BINARY_NAME=$($metadata.shellBinaryName)" |
            Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Frame provider terminal-retirement stress
        shell: pwsh
        run: >-
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest
          --preset release --output-on-failure
          -R "media.MultiSourceFrameProviderTests.SequentialPlaybackDoesNotRetainHistoricalCpuPairs"
          --repeat until-fail:100

      - name: Package and validate release identity
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 cpack --preset release-zip
          $version = '${{ needs.validate-version.outputs.version }}'
          $zip = Resolve-Path ".\out\package\zip\CompareStation-$version-windows-x64.zip"
          .\tools\release\verify-release-version.ps1 `
            -Tag $env:DVS_RELEASE_TAG `
            -Executable '.\out\build\release\bin\CompareStation.exe' `
            -ZipPath $zip.Path
          "DVS_RELEASE_ZIP=$($zip.Path)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Packaged upgrade and shutdown gates
        shell: pwsh
        run: |
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest --preset packaged-smoke --output-on-failure
          pwsh -NoProfile -File .\tools\ci\invoke-low-impact.ps1 ctest --preset shutdown-soak --output-on-failure

      - name: Create checksums
        shell: pwsh
        run: |
          $lines = foreach ($artifact in @($env:DVS_RELEASE_ZIP)) {
            $hash = (Get-FileHash -LiteralPath $artifact -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($artifact))"
          }
          $lines | Set-Content '.\out\package\SHA256SUMS.txt' -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090 # v2.4.1
        with:
          draft: true
          tag_name: ${{ env.DVS_RELEASE_TAG }}
          body_path: docs/releases/v${{ needs.validate-version.outputs.version }}.md
          files: |
            out/package/zip/CompareStation-${{ needs.validate-version.outputs.version }}-windows-x64.zip
            out/package/SHA256SUMS.txt
